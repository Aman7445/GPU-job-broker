name: gpu-job-broker

services:
  broker:
    image: ${BROKER_IMAGE:-gpu-job-broker:local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${BROKER_HTTP_PORT:-8080}:8080"
    environment:
      BROKER_CLOCK_SPEED: "${BROKER_CLOCK_SPEED:-60}"
      BROKER_IDLE_SECONDS: "${BROKER_IDLE_SECONDS:-300}"
    volumes:
      - broker-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  broker-data:
